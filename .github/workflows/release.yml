name: Release

# Push a tag like v2.8.0 to publish a release. The plugin's "Version" header and
# CBD_VERSION must match the tag, otherwise the build fails.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' community-business-directory.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "define( 'CBD_VERSION'" community-business-directory.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          echo "tag=$TAG header=$HEADER constant=$CONST"
          [ "$TAG" = "$HEADER" ] && [ "$TAG" = "$CONST" ] || { echo "::error::Tag, plugin header and CBD_VERSION must all match"; exit 1; }

      - name: Build plugin zip
        run: |
          mkdir -p build/community-business-directory
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='.gitignore' \
            --exclude='CLAUDE.md' --exclude='build' --exclude='.DS_Store' \
            ./ build/community-business-directory/
          cd build && zip -rq ../community-business-directory.zip community-business-directory

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: community-business-directory.zip
          generate_release_notes: true
